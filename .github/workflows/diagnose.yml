name: Diagnose amdm.ru reachability

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Homepage
        run: |
          echo "Status:"
          curl -sS -o /tmp/body.html -w "%{http_code}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" https://amdm.ru/akkordi/popular/ || true
          echo "First 500 bytes:"
          head -c 500 /tmp/body.html || true
          echo
          echo "Byte count:"
          wc -c /tmp/body.html || true
